<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>집중 알림</title>
  <link rel="stylesheet" href="character.css" />
</head>
<body>
  <div class="popup">
    <button class="close-btn" id="closeBtn" title="닫기">✕</button>
    <div class="character">
      <!-- 귀여운 고양이 캐릭터 (인라인 SVG) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80" aria-label="고양이 캐릭터">
        <!-- 몸통 -->
        <ellipse cx="50" cy="72" rx="28" ry="22" fill="#f9c74f"/>
        <!-- 머리 -->
        <circle cx="50" cy="45" r="26" fill="#f9c74f"/>
        <!-- 왼쪽 귀 -->
        <polygon points="26,28 20,10 38,22" fill="#f9c74f"/>
        <polygon points="28,26 23,14 36,23" fill="#ffb3c6"/>
        <!-- 오른쪽 귀 -->
        <polygon points="74,28 80,10 62,22" fill="#f9c74f"/>
        <polygon points="72,26 77,14 64,23" fill="#ffb3c6"/>
        <!-- 눈 -->
        <ellipse cx="41" cy="43" rx="5" ry="6" fill="#2d2d2d"/>
        <ellipse cx="59" cy="43" rx="5" ry="6" fill="#2d2d2d"/>
        <!-- 눈 하이라이트 -->
        <circle cx="43" cy="41" r="1.5" fill="white"/>
        <circle cx="61" cy="41" r="1.5" fill="white"/>
        <!-- 코 -->
        <ellipse cx="50" cy="52" rx="3" ry="2" fill="#ff8fab"/>
        <!-- 입 -->
        <path d="M44,56 Q50,61 56,56" stroke="#2d2d2d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- 수염 왼쪽 -->
        <line x1="20" y1="50" x2="40" y2="53" stroke="#2d2d2d" stroke-width="1" opacity="0.6"/>
        <line x1="20" y1="55" x2="40" y2="55" stroke="#2d2d2d" stroke-width="1" opacity="0.6"/>
        <!-- 수염 오른쪽 -->
        <line x1="80" y1="50" x2="60" y2="53" stroke="#2d2d2d" stroke-width="1" opacity="0.6"/>
        <line x1="80" y1="55" x2="60" y2="55" stroke="#2d2d2d" stroke-width="1" opacity="0.6"/>
      </svg>
    </div>
    <div class="message" id="message">잠깐, 집중할 시간이야! 🌟</div>
  </div>
  <script src="character.js"></script>
</body>
</html>
