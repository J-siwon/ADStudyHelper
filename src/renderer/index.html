<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADStudyHelper — 집중 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 메인: 오늘 집중 시간 + 현재 활성만 -->
  <div class="dashboard">
    <header class="header">
      <h1 class="app-title">ADStudyHelper</h1>
      <div class="badges">
        <span class="badge badge-state break" id="stateBadge">BREAK</span>
        <span class="badge badge-connection" id="connectionBadge">확장 미연결</span>
        <span class="badge badge-camera" id="cameraBadge">웹캠 꺼짐</span>
        <span class="badge badge-connection" id="phoneBadge">iPhone 꺼짐</span>
        <button class="icon-btn" id="cameraPreviewBtn" title="카메라 미리보기 열기" style="display:none">📷 미리보기</button>
        <button class="icon-btn" id="settingsBtn" title="설정">⚙ 설정</button>
        <button class="icon-btn" id="helpBtn" title="사용 방법">❓ 도움말</button>
      </div>
    </header>

    <main class="main">
      <div class="timer-label">오늘 집중 시간</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="break-timer" id="breakTimer" style="display:none"></div>
      <div class="current-app" id="currentApp">현재 활성: —</div>
    </main>
  </div>

  <!-- 설정 오버레이: 같은 화면 위로 페이드 인/아웃 -->
  <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
    <div class="settings-panel">
      <div class="settings-topbar">
        <h2 class="settings-heading">설정</h2>
        <button class="close-settings-btn" id="closeSettingsBtn" title="닫기">✕</button>
      </div>

      <div class="settings-scroll">
        <!-- 집중 판정 목록 -->
        <section class="whitelist-section">
          <h3 class="section-title">집중 판정 목록</h3>

          <div class="setting-row">
            <label class="setting-label" for="urlModeSelect">URL 판정 방식</label>
            <select class="setting-select" id="urlModeSelect">
              <option value="allow">허용 목록 (목록만 집중 인정)</option>
              <option value="block">제한 목록 (목록만 휴식 처리)</option>
            </select>
          </div>
          <p class="wl-hint" id="urlModeHint"></p>

          <div class="whitelist-editor">
            <div class="wl-col">
              <label class="wl-label" for="appsTextarea">허용 앱 (항상 집중 인정)</label>
              <textarea class="wl-textarea" id="appsTextarea" placeholder="한 줄에 하나씩 입력&#10;예: Code"></textarea>
            </div>
            <div class="wl-col">
              <label class="wl-label" for="urlsTextarea" id="urlsLabel">허용 URL 패턴</label>
              <textarea class="wl-textarea" id="urlsTextarea" placeholder="한 줄에 하나씩 입력&#10;예: github.com"></textarea>
            </div>
          </div>
          <div class="save-row">
            <button class="save-btn" id="saveBtn">저장</button>
            <span class="save-status" id="saveStatus"></span>
          </div>
        </section>

        <!-- 세부 설정 -->
        <section class="settings-section">
          <h3 class="section-title">세부 설정</h3>

          <div class="setting-row">
            <label class="setting-label" for="petToggle">코딩 펫 표시</label>
            <label class="toggle">
              <input type="checkbox" id="petToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="setting-row">
            <label class="setting-label" for="cameraToggle">웹캠 시선 추적</label>
            <label class="toggle">
              <input type="checkbox" id="cameraToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-row" id="cameraSourceRow">
            <label class="setting-label" for="cameraSourceSelect">카메라 소스</label>
            <select class="setting-select" id="cameraSourceSelect">
              <option value="webcam">내장 웹캠</option>
              <option value="stream">폰 스트림</option>
            </select>
          </div>
          <div class="setting-row" id="cameraDeviceRow">
            <label class="setting-label" for="cameraDeviceSelect">카메라 장치</label>
            <select class="setting-select" id="cameraDeviceSelect">
              <option value="">기본 장치</option>
            </select>
          </div>
          <div class="setting-row" id="cameraStreamRow">
            <label class="setting-label" for="cameraStreamUrlInput">폰 스트림 URL</label>
            <input class="setting-input" type="text" id="cameraStreamUrlInput"
                   placeholder="예: http://192.168.0.x:8080/video" />
          </div>

          <div class="setting-row">
            <label class="setting-label" for="ntfyTopicInput">ntfy 토픽</label>
            <input class="setting-input" type="text" id="ntfyTopicInput"
                   placeholder="예: my-focus-alerts" />
          </div>

          <div class="setting-row">
            <label class="setting-label" for="awayThresholdInput">자리 비움 알림 (분)</label>
            <input class="setting-input setting-input--short" type="number"
                   id="awayThresholdInput" min="1" max="120" value="10" />
          </div>

          <div class="setting-row">
            <label class="setting-label">폰 제어 주소</label>
            <span class="setting-value" id="controlUrl">—</span>
          </div>

          <h3 class="section-title section-title--sub">iPhone Screen Time 연동</h3>
          <p class="setting-hint">
            기존 코딩 세션과 별도로 동작합니다. 예약 휴식은 허용 앱보다 우선하며 경고를 보내지 않습니다.
          </p>

          <div class="setting-row">
            <label class="setting-label" for="phoneIntegrationToggle">iPhone 연동</label>
            <label class="toggle">
              <input type="checkbox" id="phoneIntegrationToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="setting-row">
            <label class="setting-label" for="phoneDetectionModeSelect">감지 방식</label>
            <select class="setting-select" id="phoneDetectionModeSelect">
              <option value="screen_on">화면 켜짐 근사 (모든 앱 사용)</option>
              <option value="actual_use">실제 사용 (선택한 앱)</option>
            </select>
          </div>
          <p class="setting-hint" id="phoneModeHint"></p>

          <div class="setting-row">
            <label class="setting-label" for="phoneBreakDurationInput">감지 후 쉬는 시간 (초)</label>
            <input class="setting-input setting-input--short" type="number"
                   id="phoneBreakDurationInput" min="5" max="3600" value="60" />
          </div>

          <div class="setting-row" id="phoneActualUseThresholdRow">
            <label class="setting-label" for="phoneActualUseThresholdInput">실제 사용 감지 기준 (초)</label>
            <input class="setting-input setting-input--short" type="number"
                   id="phoneActualUseThresholdInput" min="1" max="3600" value="60" />
          </div>

          <div class="setting-row">
            <label class="setting-label" for="phoneAlertMessageInput">집중 경고 문구</label>
            <input class="setting-input" type="text" id="phoneAlertMessageInput" value="집중해라!!!" />
          </div>

          <div class="setting-row setting-row--stack">
            <label class="setting-label">iPhone 앱 서버 주소</label>
            <span class="setting-value" id="phoneServerUrl">—</span>
          </div>
          <div class="setting-row setting-row--stack">
            <label class="setting-label">iPhone 앱 페어링 토큰</label>
            <span class="setting-value setting-value--secret" id="phonePairingToken">—</span>
          </div>
          <p class="setting-hint">예약 휴식 시간과 감지 대상 앱은 iPhone 동반 앱에서 지정합니다.</p>

          <div class="save-row">
            <button class="save-btn" id="settingsSaveBtn">설정 저장</button>
            <span class="save-status" id="settingsSaveStatus"></span>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
