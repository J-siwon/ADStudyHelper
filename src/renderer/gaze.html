<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' mp:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: mediastream:; connect-src 'self' mp: blob: data:; worker-src 'self' blob:" />
  <title>카메라 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #1a1d2e; overflow: hidden;
      font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; color: #e2e5f0;
    }
    .preview {
      position: relative; width: 320px; height: 240px; margin: 6px auto 0;
      background: #000; border-radius: 8px; overflow: hidden;
    }
    #videoEl, #streamEl, #overlay {
      position: absolute; inset: 0; width: 320px; height: 240px;
    }
    #videoEl { object-fit: cover; transform: scaleX(-1); }   /* 거울 모드 */
    #streamEl { object-fit: cover; display: none; }
    #overlay { transform: scaleX(-1); pointer-events: none; }
    #status {
      font-size: 12px; padding: 6px 8px; text-align: center; color: #8a8fbb;
    }
    #badge {
      display: inline-block; margin-top: 2px; padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; background: #232639; border: 1px solid #2e3150; color: #8a8fbb;
    }
    #badge.ok { background: rgba(67,233,123,0.14); border-color: #43e97b; color: #43e97b; }
    #badge.off { background: rgba(247,151,30,0.14); border-color: #f7971e; color: #f7971e; }
    #calibration { display: none; }
  </style>
</head>
<body>
  <div class="preview">
    <video id="videoEl" autoplay muted playsinline></video>
    <img id="streamEl" alt="phone camera stream" />
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>
  <div id="status">초기화 중...</div>
  <div style="text-align:center;"><span id="badge">대기</span></div>
  <!-- 캘리브레이션은 MediaPipe에서 불필요(미사용) -->
  <div id="calibration"><button id="skipCalBtn"></button></div>

  <!-- 순수 시선 계산 로직 (window.gazeMath) -->
  <script src="../shared/gazeMath.js"></script>
  <!-- MediaPipe 기반 추적 (ESM) -->
  <script type="module" src="gaze.js"></script>
</body>
</html>
